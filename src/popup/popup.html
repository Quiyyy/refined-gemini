<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Refined Gemini</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-shell">
    <!-- Top Header: Brand + Language Switcher + Master Toggle -->
    <header class="header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <path d="M12 3C12.4 7.8 16.2 11.6 21 12C16.2 12.4 12.4 16.2 12 21C11.6 16.2 7.8 12.4 3 12C7.8 11.6 11.6 7.8 12 3Z" fill="currentColor"/>
          </svg>
        </div>
        <h1 class="brand-title">Refined Gemini</h1>
      </div>

      <div class="header-actions">
        <div class="lang-switch" id="langSwitch" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="zh">中</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>

        <label class="switch" id="masterSwitchLabel">
          <input type="checkbox" id="toggleEnabled" checked />
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
      </div>
    </header>

    <!-- Main Settings Body -->
    <main class="settings-body" id="settingsBody">
      <!-- Segmented Controls -->
      <section class="group">
        <div class="field-block">
          <span class="field-label" data-i18n="theme">外观</span>
          <div class="segmented" role="radiogroup" data-key="themeMode">
            <button type="button" class="seg-btn active" data-value="auto" data-i18n="themeAuto">跟随</button>
            <button type="button" class="seg-btn" data-value="light" data-i18n="themeLight">浅色</button>
            <button type="button" class="seg-btn" data-value="dark" data-i18n="themeDark">深色</button>
          </div>
        </div>

        <div class="field-block">
          <span class="field-label" data-i18n="width">列宽</span>
          <div class="segmented" role="radiogroup" data-key="chatWidth">
            <button type="button" class="seg-btn active" data-value="800px">768px</button>
            <button type="button" class="seg-btn" data-value="920px">920px</button>
            <button type="button" class="seg-btn" data-value="1120px">1120px</button>
            <button type="button" class="seg-btn" data-value="90%">90%</button>
          </div>
        </div>

        <div class="field-block">
          <span class="field-label" data-i18n="fontSize">字号</span>
          <div class="segmented" role="radiogroup" data-key="fontSize">
            <button type="button" class="seg-btn" data-value="15px">15px</button>
            <button type="button" class="seg-btn active" data-value="16px">16px</button>
            <button type="button" class="seg-btn" data-value="17px">17px</button>
          </div>
        </div>

        <div class="field-block">
          <span class="field-label" data-i18n="indent">缩进</span>
          <div class="segmented" role="radiogroup" data-key="indentScale">
            <button type="button" class="seg-btn" data-value="0">0%</button>
            <button type="button" class="seg-btn" data-value="0.65">65%</button>
            <button type="button" class="seg-btn active" data-value="1" data-i18n="indentGpt">标准 GPT</button>
            <button type="button" class="seg-btn" data-value="1.25">125%</button>
          </div>
        </div>
      </section>

      <div class="divider"></div>

      <!-- Boolean Switches -->
      <section class="group switches-list">
        <label class="row-item" for="toggleHideAvatar">
          <span class="row-title" data-i18n="hideAvatar">隐藏 AI 头像</span>
          <span class="switch switch-sm">
            <input type="checkbox" id="toggleHideAvatar" checked />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </span>
        </label>

        <label class="row-item" for="toggleCompactSidebar">
          <span class="row-title" data-i18n="compactSidebar">紧凑侧边栏</span>
          <span class="switch switch-sm">
            <input type="checkbox" id="toggleCompactSidebar" checked />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </span>
        </label>

        <label class="row-item" for="toggleCleanView">
          <span class="row-title" data-i18n="cleanView">纯净模式</span>
          <span class="switch switch-sm">
            <input type="checkbox" id="toggleCleanView" checked />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </span>
        </label>

        <label class="row-item" for="toggleCtrlEnter">
          <span class="row-title">
            <kbd id="modKeyLabel">Ctrl</kbd> + <kbd>Enter</kbd>
            <span data-i18n="sendSuffix">发送</span>
          </span>
          <span class="switch switch-sm">
            <input type="checkbox" id="toggleCtrlEnter" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </span>
        </label>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span class="version">v1.6.1</span>
      <button type="button" id="resetBtn" class="reset-btn" data-i18n="reset">恢复默认</button>
    </footer>
  </div>

  <script src="../defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
